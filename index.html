<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Password Redirect</title>
  <style>
    body, html {
      height: 100%;
      margin: 0;
      background-color: black;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: sans-serif;
      color: white;
    }

    .form-container {
      text-align: center;
    }

    input[type="password"] {
      padding: 0.5rem;
      font-size: 1rem;
      background-color: transparent;
      border: 2px solid white;
      color: white;
      outline: none;
      margin-bottom: 1rem;
    }

    button {
      padding: 0.5rem 1rem;
      font-size: 1rem;
      background-color: white;
      color: black;
      border: none;
      cursor: pointer;
    }

    button:hover {
      background-color: gray;
      color: white;
    }
  </style>
  <script>
    function checkPassword(event) {
      event.preventDefault();
      const password = document.getElementById("password").value;
      if (password === "JellyBelly") {
        window.location.href = "https://projecthomunculus.github.io/"; // Change to your target URL
      } else {
        alert("Incorrect password.");
      }
    }
  </script>
</head>
<body>
  <form class="form-container" onsubmit="checkPassword(event)">
    <label for="password">Enter Password:</label><br/>
    <input type="password" id="password" name="password" required /><br/>
    <button type="submit">Submit</button>
  </form>
</body>
</html>

	</body>
</html>
